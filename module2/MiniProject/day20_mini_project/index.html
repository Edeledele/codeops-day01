<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Country Facts</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1>Country Facts</h1>

    <form id="search-form" class="search-form">
      <label for="country-input" class="visually-hidden">Country name</label>
      <input
        id="country-input"
        type="text"
        placeholder="Enter a country name…"
        value="Ethiopia"
        autocomplete="off"
      />
      <button type="submit">Search</button>
    </form>

    <section id="facts" aria-live="polite">
      Loading…
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
