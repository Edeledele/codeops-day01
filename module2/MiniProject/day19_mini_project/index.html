<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Addis Market — Shopping List</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="page">

    <header class="masthead">
      <p class="eyebrow">Merkato &amp; Piassa</p>
      <h1>Addis Market</h1>
      <p class="tagline">Keep track of what's left to buy this week.</p>
    </header>

    <div class="tibeb-strip" aria-hidden="true"></div>

    <main>
      <form id="add-form" class="add-form" novalidate>
        <div class="field field-name">
          <label for="name">Item</label>
          <input id="name" name="name" type="text" placeholder="e.g. Berbere spice" autocomplete="off">
        </div>

        <div class="field field-price">
          <label for="price">Price (ETB)</label>
          <input id="price" name="price" type="number" min="0" step="0.01" placeholder="0.00" inputmode="decimal">
        </div>

        <button type="submit" class="btn-add">Add to list</button>

        <p id="form-error" class="form-error" role="alert" aria-live="polite"></p>
      </form>

      <p id="empty-state" class="empty-state">Your list is empty. Add the first thing you need from the market.</p>

      <ul id="list" class="list" aria-live="polite"></ul>
    </main>

    <div class="tibeb-strip" aria-hidden="true"></div>

    <footer class="total-bar">
      <span class="total-label">Total</span>
      <span id="total" class="total-amount">0.00 ETB</span>
    </footer>

  </div>

  <script src="App.js"></script>
</body>
</html>
