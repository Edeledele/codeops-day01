<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signup Form</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="card">
    <h1>Create your account</h1>
    <p class="subtitle">Enter your name and Ethiopian phone number.</p>

    <form id="signup-form" novalidate>
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" placeholder="e.g. Abebe Kebede" />

      <label for="phone">Phone number</label>
      <input type="tel" id="phone" name="phone" placeholder="e.g. 0912345678 or +251912345678" />

      <div id="error-area" role="alert"></div>
      <div id="success-area" role="status"></div>

      <button type="submit">Sign up</button>
    </form>

    <h2>Saved signups</h2>
    <ul id="entry-list"></ul>
    <p id="empty-message">No signups saved yet.</p>
  </div>

  <script src="app.js"></script>
</body>

</html>
